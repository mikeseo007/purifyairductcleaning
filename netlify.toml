[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old WordPress URLs that should keep their link equity.
[[redirects]]
  from = "/hello-world/"
  to = "/blog/"
  status = 301

# Renamed when the service structure was reorganized.
[[redirects]]
  from = "/hvac-system-cleaning/"
  to = "/hvac-cleaning/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/our-services/"
  status = 301

[[redirects]]
  from = "/locations/"
  to = "/service-areas/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/author/*"
  to = "/about-us/"
  status = 301

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/feed/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/post-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
